name: grinta
description: A new Flutter application.

version: 1.0.20+20

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  firebase_messaging: ^16.0.1
  firebase_analytics: ^12.1.3
  flutter_local_notifications: ^19.4.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.0.0
  cloud_firestore: ^6.1.3
  crypto: ^3.0.7
  cloud_functions: ^6.0.7
  file_picker: ^10.3.10
  provider: ^6.1.5+1
  uuid: ^4.5.3
  fl_chart: ^1.2.0
  path_provider: ^2.1.5
  archive: ^4.0.9
  firebase_storage: ^13.2.0
  flutter_svg: ^2.2.4
  flutter_compass: ^0.8.1
  stream_chat_flutter: ^9.23.0
  emoji_picker_flutter: ^4.3.0
  video_player: ^2.11.1
  image_picker: ^1.2.1
  responsive_builder: ^0.7.1
  stream_chat_localizations: ^9.23.0
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  http: ^1.6.0
  cached_network_image: ^3.4.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  media_kit_libs_ios_video: ^1.1.4
  country_picker: ^2.0.27
  purchases_flutter: ^10.3.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  # Face ID / Touch ID / Android biometrics for optional app unlock + login.
  local_auth: ^2.3.0
  # Keychain / Keystore vault for optional biometric email/password re-login.
  flutter_secure_storage: ^10.3.1
  web: ^1.1.1
  # 4.x uses Android V2 embedding (required since Flutter removed Registrar).
  device_calendar: ^4.3.3
  app_links: ^6.4.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  timezone: ^0.10.1
  health: ^13.1.4
  pdf: ^3.12.0
  image: ^4.8.0
  # Polar BLE SDK wrapper (Android/iOS only; imported via conditional export).
  # 7.7.x keeps Dart SDK >=3.0; newer majors need Dart 3.8+.
  polar: ^7.7.3
  # Runtime API keeps the native splash visible during boot (see main.dart).
  flutter_native_splash: ^2.4.6
  package_info_plus: ^9.0.1

# device_calendar 4.3.3 pins timezone ^0.9.0; flutter_local_notifications needs ^0.10.
dependency_overrides:
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sealed_countries: ^3.2.0

flutter_native_splash:
  # Match iOS LaunchScreen: brand orange + centered IN monogram.
  color: "#F95C1B"
  image: assets/images/splash_logo.png
  color_dark: "#111214"
  image_dark: assets/images/splash_logo_dark.png
  android_12:
    # Transparent white IN; orange icon plate so the A12 circle matches iOS branding.
    image: assets/images/splash_logo.png
    icon_background_color: "#F95C1B"
    image_dark: assets/images/splash_logo.png
    icon_background_color_dark: "#F95C1B"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logoFondOrange.png
    - assets/images/logoFondBlanc.png
    - assets/images/logoNoirFondBlanc.png
    - assets/images/splash_logo.png
    - assets/images/splash_logo_dark.png
    - assets/images/google_logo.svg
    - assets/images/apple_logo.svg
    - assets/images/strava_logo.svg
    - assets/images/polar_logo.png
    - assets/images/whoop_logo.svg
    - assets/images/oura_logo.svg
    - assets/images/apple_forme_logo.svg
    - assets/images/google_fit_logo.svg
    - assets/images/ask_gio_avatar.png
    - assets/images/login_slide1_mobile.png
    - assets/images/login_slide2_mobile.png
    - assets/images/login_slide3_mobile.png
    - assets/images/login_slide1_web.png
    - assets/images/login_slide2_web.png
    - assets/images/login_slide3_web.png
    - assets/images/flags/

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700