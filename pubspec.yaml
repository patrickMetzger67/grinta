name: grinta
description: A new Flutter application.

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  firebase_analytics: ^12.1.3
  cloud_firestore: ^6.1.3
  crypto: ^3.0.7
  cloud_functions: ^6.0.7
  file_picker: ^10.3.10
  provider: ^6.1.5+1
  uuid: ^4.5.3
  fl_chart: ^1.2.0
  path_provider: ^2.1.5
  archive: ^4.0.9
  firebase_storage: ^13.2.0
  flutter_svg: ^2.2.4
  flutter_compass: ^0.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logoFondOrange.png

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700