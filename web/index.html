<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Grinta Performance">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111214">

  <title>Grinta Performance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Instant boot splash (covers white page while Flutter JS downloads). -->
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      /* Match app dark scaffold so no brand-orange gap shows under the canvas. */
      background: #111214;
      overflow: hidden;
      /* Pin to the visual viewport so mobile/tablet Chrome chrome
         cannot leave a brand-colored strip under the Flutter view. */
      position: fixed;
      inset: 0;
    }
    flt-glass-pane,
    flutter-view {
      height: 100% !important;
      width: 100% !important;
    }
    #grinta-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #F95C1B;
      transition: opacity 220ms ease;
    }
    @media (prefers-color-scheme: dark) {
      #grinta-boot-splash { background: #111214; }
      #grinta-boot-splash .boot-spinner {
        border-color: rgba(255, 255, 255, 0.22);
        border-top-color: #F95C1B;
      }
    }
    #grinta-boot-splash.boot-hide {
      opacity: 0;
      pointer-events: none;
    }
    #grinta-boot-splash img {
      width: min(160px, 42vw);
      height: auto;
      display: block;
    }
    #grinta-boot-splash .boot-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      animation: grinta-boot-spin 0.75s linear infinite;
    }
    @keyframes grinta-boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body oncontextmenu="return false;">
<div id="grinta-boot-splash" aria-busy="true" aria-label="Chargement Grinta">
  <img src="icons/Icon-192.png" alt="Grinta" width="192" height="192"/>
  <div class="boot-spinner" role="progressbar"></div>
</div>
<script>
  (function () {
    var removed = false;
    function hideBootSplash() {
      if (removed) return;
      removed = true;
      var el = document.getElementById('grinta-boot-splash');
      if (!el) return;
      el.classList.add('boot-hide');
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 240);
    }
    window.addEventListener('flutter-first-frame', hideBootSplash);
    // Safety net if the event is missed.
    setTimeout(hideBootSplash, 20000);
  })();
</script>

<script>
  window.asiUsb = {
    _device: null,

    async requestDevice(options) {
      if (!navigator.usb) {
        throw new Error("WebUSB non supporté");
      }

      console.log("requestDevice options =", options);

      const device = await navigator.usb.requestDevice(options);

      this._device = device;

      return {
        vendorId: device.vendorId,
        productId: device.productId,
        productName: device.productName || "",
        serialNumber: device.serialNumber || ""
      };
    },

    async getDevices() {
      if (!navigator.usb) {
        throw new Error("WebUSB non supporté");
      }

      const devices = await navigator.usb.getDevices();

      // Si le navigateur connaît déjà un seul capteur ASI autorisé,
      // on restaure automatiquement la référence WebUSB réelle.
      const asiDevices = devices.filter(device =>
        device.vendorId === 0x1915 && device.productId === 0x5203
      );

      if (!this._device && asiDevices.length === 1) {
        this._device = asiDevices[0];
      }

      return asiDevices.map(device => ({
        vendorId: device.vendorId,
        productId: device.productId,
        productName: device.productName || "",
        serialNumber: device.serialNumber || ""
      }));
    },

    async _restoreSelectedDevice() {
      if (this._device) {
        return this._device;
      }

      if (!navigator.usb) {
        throw new Error("WebUSB non supporté");
      }

      const devices = await navigator.usb.getDevices();

      const asiDevices = devices.filter(device =>
        device.vendorId === 0x1915 && device.productId === 0x5203
      );

      if (asiDevices.length === 0) {
        throw new Error("No device selected");
      }

      // L'application ne pilote qu'un capteur à la fois.
      this._device = asiDevices[0];
      return this._device;
    },

    async open() {
      const device = await this._restoreSelectedDevice();

      if (!device.opened) {
        await device.open();
      }

      if (!device.configuration) {
        await device.selectConfiguration(1);
      }

      try {
        await device.claimInterface(0);
      } catch (e) {
        // Chrome peut signaler que l'interface est déjà réclamée.
        // Dans ce cas, la session est tout de même utilisable.
        console.warn("claimInterface(0)", e);
      }
    },

    async close() {
      const device = this._device;
      if (!device) return;

      try { await device.releaseInterface(0); } catch (_) {}
      try { await device.close(); } catch (_) {}

      // IMPORTANT :
      // on conserve la référence USBDevice afin de pouvoir rouvrir
      // immédiatement le même capteur sans redemander l'autorisation.
      // Ne pas faire : this._device = null;
    },

    async prepareEndpoints(inEndpointNumber, outEndpointNumber) {
      const device = await this._restoreSelectedDevice();

      if (!device.opened) {
        await device.open();
      }

      if (!device.configuration) {
        await device.selectConfiguration(1);
      }

      try {
        await device.claimInterface(0);
      } catch (_) {
        // L'interface peut déjà être réclamée.
      }

      // IMPORTANT :
      // ne pas appeler device.reset() ici.
      // reset() réinitialise le périphérique et peut invalider la session
      // juste avant l'envoi de CMD_DATA_READ.
      try { await device.clearHalt('in', inEndpointNumber); } catch (_) {}
      try { await device.clearHalt('out', outEndpointNumber); } catch (_) {}
    },

    async transferOut(endpointNumber, data) {
      const device = this._device;
      if (!device) throw new Error("No device selected");

      console.log('USB transferOut request', endpointNumber, Array.from(data));
      const result = await device.transferOut(endpointNumber, data);
      console.log('USB transferOut result', result);
      return result.bytesWritten || 0;
    },

    async transferIn(endpointNumber, length) {
      const device = this._device;
      if (!device) throw new Error("No device selected");

      try {
        console.log('USB transferIn request', endpointNumber, length);
        const result = await device.transferIn(endpointNumber, length);

        console.log(
          'USB transferIn result',
          'status=', result.status,
          'byteLength=', result.data ? result.data.byteLength : 0
        );

        if (result.status === 'stall') {
          try { await device.clearHalt('in', endpointNumber); } catch (_) {}
          throw new Error('USB IN stalled');
        }

        if (!result.data || result.data.byteLength === 0) {
          return [];
        }

        const view = new Uint8Array(
          result.data.buffer,
          result.data.byteOffset,
          result.data.byteLength
        );

        return Array.from(view);
      } catch (e) {
        console.error('USB transferIn error', e);
        try { await device.clearHalt('in', endpointNumber); } catch (_) {}
        throw e;
      }
    },
  };
</script>

<!-- FCM: service worker for background web push (see web/firebase-messaging-sw.js). -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/firebase-messaging-sw.js', {
        scope: '/firebase-cloud-messaging-push-scope',
      }).catch(function (err) {
        console.warn('[FCM] service worker registration failed:', err);
      });
    });
  }
</script>

<!-- Google Maps: deferred so it does not block the first paint / Flutter download. -->
<script>
  (function () {
    var loaded = false;
    window.grintaLoadGoogleMaps = function () {
      if (loaded) return;
      loaded = true;
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyDyHHcP9py2HCyx18Ssels7qqygKxeUZG0';
      s.async = true;
      document.head.appendChild(s);
    };
    // Warm the Maps SDK after Flutter has painted (or after a short idle).
    window.addEventListener('flutter-first-frame', function () {
      setTimeout(window.grintaLoadGoogleMaps, 800);
    });
    setTimeout(window.grintaLoadGoogleMaps, 4000);
  })();
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
