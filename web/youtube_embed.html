<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Grinta YouTube Embed</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe
    id="player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    (function () {
      var u = new URL(location.href);
      var v = u.searchParams.get('v');
      if (!v) {
        document.body.textContent = 'Missing ?v=VIDEO_ID';
        return;
      }
      var params = new URLSearchParams({
        enablejsapi: '1',
        rel: '0',
        modestbranding: '1',
        playsinline: u.searchParams.get('playsinline') || '1',
        autoplay: u.searchParams.get('autoplay') || '0',
        fs: '1',
        origin: location.origin,
        widget_referrer: location.origin
      });
      document.getElementById('player').src =
        'https://www.youtube.com/embed/' + encodeURIComponent(v) + '?' + params;
    })();
  </script>
</body>
</html>
